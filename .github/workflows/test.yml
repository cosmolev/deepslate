name: Test

on:
  push:
    branches:
      - main
      - 'vanilla-*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Build
      run: |
        npm ci
        npm run build

    - name: Test
      run: npx vitest run -r ./test --threads=false
